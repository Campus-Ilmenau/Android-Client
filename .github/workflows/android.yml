name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build, Tests, Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build (debug)
      run: ./gradlew assembleDebug

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: Lint
      run: ./gradlew lintDebug

    - name: Release build (R8, unsigned)
      run: ./gradlew assembleRelease

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/tests/testDebugUnitTest/

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check for keystores and signing files
      run: |
        echo "Checking for keystores..."
        if find . -name "*.jks" -o -name "*.keystore" -o -name "keystore.properties" | grep -q .; then
          echo "❌ ERROR: Found a keystore or signing file in the repository!"
          exit 1
        else
          echo "✅ No keystores found"
        fi

    - name: Check for service account keys
      run: |
        echo "Checking for Play service account keys..."
        if grep -rIl '"type": *"service_account"' . --exclude-dir=.git | grep -q .; then
          echo "❌ ERROR: Found a service account key!"
          exit 1
        else
          echo "✅ No service account keys found"
        fi

    - name: Check for Firebase config
      run: |
        if find . -name "google-services.json" | grep -q .; then
          echo "⚠️ WARNING: Found google-services.json. Make sure it contains no secrets."
        else
          echo "✅ No Firebase config found"
        fi

    - name: Check for cleartext http URLs in the app
      run: |
        echo "Checking for http:// URLs in app code..."
        # Erlaubt: Prüfungen des Schemas (startsWith) vor dem Öffnen fremder Links.
        if grep -rn "\"http://" app/src/main --include="*.kt" --include="*.xml" | grep -v "schemas.android.com" | grep -v "startsWith"; then
          echo "❌ ERROR: Found a cleartext URL. The app speaks HTTPS only."
          exit 1
        else
          echo "✅ No cleartext URLs found"
        fi

    - name: Check the manifest keeps backups off the credentials
      run: |
        grep -q "paia_credentials" app/src/main/res/xml/data_extraction_rules.xml
        grep -q "paia_credentials" app/src/main/res/xml/backup_rules.xml
        echo "✅ Credentials are excluded from backups"
